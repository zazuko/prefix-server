name: Test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build the app
        run: |
          npm run build-data
          npm run build

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run start
          wait-on: "http://localhost:3000"
